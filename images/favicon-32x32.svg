<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#F5E6D3" rx="5"/>
  
  <!-- Outer circle accent -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#D4534F" stroke-width="1" opacity="0.3"/>
  
  <!-- Letter R - clear and bold -->
  <text x="16" y="23" font-size="18" font-weight="bold" font-family="Arial, sans-serif" fill="#D4534F" text-anchor="middle">R</text>
  
  <!-- Colorful decorative beads (polymer clay elements) -->
  <circle cx="6" cy="8" r="2" fill="#FFD700"/>
  <circle cx="26" cy="10" r="1.8" fill="#FF69B4"/>
  <circle cx="27" cy="24" r="1.5" fill="#00CED1"/>
  <circle cx="5" cy="24" r="1.6" fill="#90EE90"/>
</svg>